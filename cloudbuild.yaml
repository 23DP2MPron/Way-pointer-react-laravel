# Google Cloud Build configuration
steps:
  # Build Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/waypointer-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/waypointer-backend:latest'
      - '.'
    dir: '.'

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/waypointer-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/waypointer-frontend:latest'
      - '.'
    dir: 'waypointer-frontend'

  # Push Backend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/waypointer-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/waypointer-backend:latest'

  # Push Frontend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/waypointer-frontend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/waypointer-frontend:latest'

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'waypointer-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/waypointer-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'waypointer-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/waypointer-frontend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'

images:
  - 'gcr.io/$PROJECT_ID/waypointer-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/waypointer-backend:latest'
  - 'gcr.io/$PROJECT_ID/waypointer-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/waypointer-frontend:latest'

timeout: 1800s
