# Google Cloud App Engine configuration for Backend
runtime: php82

env: standard

entrypoint: serve /var/www/public

env_variables:
  APP_ENV: production
  APP_DEBUG: false
  APP_KEY: base64:YOUR_APP_KEY_HERE
  LOG_CHANNEL: stderr
  SESSION_DRIVER: cookie
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65

handlers:
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301

# Cloud SQL connection (uncomment and configure)
# beta_settings:
#   cloud_sql_instances: YOUR_PROJECT_ID:YOUR_REGION:YOUR_INSTANCE_NAME
